name: Deploy Production Dependencies and Code 🚀
on:
  workflow_dispatch:
  push:
    branches:
      - 'releases/v*'
      - 'releases/beta'
    tags-ignore:
      - '*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Clobber lib
        run: rm -rf lib

      - name: Set up .gitignore
        run: |
          sed -i -e's/^lib/# lib/' -e's/^node_module/# node_modules/' .gitignore

      - name: Build
        run: |
          yarn install
          yarn build

      - name: Install Production node_modules
        run: |
          yarn install --production --frozen-lockfile

      - name: Commit and Push
        # Keep the run green if the commit fails for the lack of changes
        continue-on-error: true
        env:
          GIT_CONFIG_EMAIL: ${{ secrets.GIT_CONFIG_EMAIL }}
          GIT_CONFIG_NAME: ${{ secrets.GIT_CONFIG_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.email "$GIT_CONFIG_EMAIL"
          git config user.name "$GIT_CONFIG_NAME"
          git add .
          git commit -m "Deploy Production Code for Commit $COMMIT_SHA 🚀"
          git push
