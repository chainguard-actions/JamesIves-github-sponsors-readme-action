name: Publish Sponsors to README 📣

on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6

permissions:
  contents: write

jobs:
  generate-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: config
        run: |
          git config --global extensions.worktreeConfig false
          git config --global worktree.guessRemoteHEAD false

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@2fd9142e765f755780202122261dc85e78459405 # v1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          template: '<a href="https://github.com/{{{ login }}}"><img src="{{{ avatarUrl }}}" width="50px" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'
          maximum: 2499
          marker: 'real-sponsors'
          active-only: false
          include-private: true

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@2fd9142e765f755780202122261dc85e78459405 # v1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          minimum: 2500
          template: '<a href="https://github.com/{{{ login }}}"><img src="{{{ avatarUrl }}}" width="80px" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'
          marker: 'real-premium'
          active-only: false
          include-private: true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: dev
          folder: '.'
