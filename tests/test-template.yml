name: Test template input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers
        run: |
          cat > "$GITHUB_WORKSPACE/README-template.md" << 'EOF'
          # Test Template README
          <!-- sponsors -->
          <!-- sponsors -->
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          file: README-template.md
          template: "<a href='https://github.com/SPONSOR'><img src='AVATAR' width='50' height='50' alt='SPONSOR' /></a>"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sponsorshipStatus: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but sponsorshipStatus output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
