name: Test template input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEMPLATE_README.md" <<'EOF'
          # My Project

          ## Sponsors

          <!-- sponsors -->
          <!-- sponsors -->

          Thank you!
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: TEMPLATE_README.md
          template: '<a href="https://github.com/<%= login %>"><img src="<%= avatarUrl %>" width="50" height="50" alt="<%= login %>" /></a>'

      - name: Assert action ran with template input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sponsorshipStatus: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but sponsorshipStatus output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo/token scope)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
