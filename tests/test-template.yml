name: Test template input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEMPLATE_README.md" << 'EOF'
          # Test Template README
          <!-- sponsors --><!-- sponsors -->
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          file: TEMPLATE_README.md
          template: '<a href="https://github.com/<%= login %>"><img src="<%= avatarUrl %>" width="60px" alt="<%= name %>" /></a>'
          fallback: No sponsors yet.

      - name: Assert action ran and produced a status output
        env:
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sponsorshipStatus: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but sponsorshipStatus output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API call failed or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
