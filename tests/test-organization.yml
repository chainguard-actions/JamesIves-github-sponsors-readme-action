name: Test organization input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers
        run: |
          cat > /tmp/ORG_README.md << 'EOF'
          # Test Org README
          <!-- sponsors --><!-- sponsors -->
          EOF
          cp /tmp/ORG_README.md "$GITHUB_WORKSPACE/ORG_README.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          file: ORG_README.md
          organization: true
          fallback: No organization sponsors yet.

      - name: Assert action ran and produced a status output
        env:
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sponsorshipStatus: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but sponsorshipStatus output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (org token scope or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
