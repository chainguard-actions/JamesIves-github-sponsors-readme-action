name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README file
        run: |
          cat > "$GITHUB_WORKSPACE/README.md" << 'EOF'
          # Test Project

          ## Sponsors

          <!-- sponsors --><!-- sponsors -->

          Thanks for your support!
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: README.md

      - name: Assert action ran and produced a sponsorshipStatus output
        env:
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sponsorshipStatus: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but sponsorshipStatus output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (GITHUB_TOKEN lacks user:read/org:read scope for sponsors API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
