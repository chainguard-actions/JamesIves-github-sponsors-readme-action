name: Test basic usage - sponsors markers present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers
        run: |
          printf '# Test README\n\n## Sponsors\n\n<!-- sponsors --><!-- sponsors -->\n\nThanks for your support!\n' \
            > "$GITHUB_WORKSPACE/TEST_README.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          file: ${{ github.workspace }}/TEST_README.md

      - name: Assert sponsorshipStatus is a known value
        env:
          ACTUAL: ${{ steps.action.outputs.sponsorshipStatus }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$ACTUAL" = "success" ] || [ "$ACTUAL" = "skipped" ] || [ "$ACTUAL" = "failed" ]; then
            echo "PASS: sponsorshipStatus is '$ACTUAL' (known outcome)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action step failed (output: '$ACTUAL') - acceptable under test constraints"
          else
            echo "FAIL: unexpected state: status='$ACTUAL' outcome='$OUTCOME'"
            exit 1
          fi

      - name: Assert README file still exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/TEST_README.md" ]; then
            echo "FAIL: TEST_README.md not found after action ran"
            exit 1
          fi
          echo "PASS: TEST_README.md exists"
          cat "$GITHUB_WORKSPACE/TEST_README.md"
