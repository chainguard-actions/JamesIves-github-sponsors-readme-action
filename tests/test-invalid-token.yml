name: Test invalid token - action handles API error gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with sponsor markers in workspace
        run: |
          printf '# Test README\n<!-- sponsors --><!-- sponsors -->\n' > "$GITHUB_WORKSPACE/test-readme.md"

      - id: action
        uses: .
        with:
          token: invalid-token-for-testing
          file: test-readme.md
        continue-on-error: true

      - name: Assert sponsorshipStatus output is set to a valid value
        env:
          ACTUAL: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: sponsorshipStatus output was empty"
            exit 1
          fi
          # With an invalid token and network access, the GitHub API returns an error JSON.
          # The action processes it gracefully (no sponsors, empty fallback) and returns 'success'.
          # If network is unavailable, fetch throws and returns 'failed'.
          # Both are valid outcomes for this test.
          if [ "$ACTUAL" = "success" ] || [ "$ACTUAL" = "failed" ]; then
            echo "PASS: sponsorshipStatus=$ACTUAL"
          else
            echo "FAIL: unexpected sponsorshipStatus '$ACTUAL'"
            exit 1
          fi
