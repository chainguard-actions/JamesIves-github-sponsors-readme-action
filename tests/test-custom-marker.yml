name: Test custom marker
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to writable location
        run: cp $GITHUB_WORKSPACE/tests/fixtures/custom-marker-readme.md /tmp/custom-marker-readme.md

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: /tmp/custom-marker-readme.md
          marker: gold
        continue-on-error: true

      - name: Assert sponsorshipStatus output is set
        env:
          ACTUAL: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected sponsorshipStatus to be set (success or failed)"
            exit 1
          fi
          if [ "$ACTUAL" != "success" ] && [ "$ACTUAL" != "failed" ]; then
            echo "FAIL: expected 'success' or 'failed' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: sponsorshipStatus=$ACTUAL"
