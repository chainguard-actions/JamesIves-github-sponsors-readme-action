name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create target README file
        run: |
          cat > "$GITHUB_WORKSPACE/test-optional-readme.md" << 'EOF'
          # Test README
          <!-- sponsors --><!-- sponsors -->
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          file: test-optional-readme.md
          minimum: 500
          maximum: 10000
          active-only: 'false'
          include-private: 'true'
          fallback: '<p>No sponsors yet</p>'

      - name: Assert sponsorshipStatus output is set
        env:
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "sponsorshipStatus: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: sponsorshipStatus output was not set"
            exit 1
          fi
          echo "PASS: sponsorshipStatus is '$STATUS'"

      - name: Assert sponsorshipStatus is a valid value
        env:
          STATUS: ${{ steps.action.outputs.sponsorshipStatus }}
        run: |
          echo "sponsorshipStatus: $STATUS"
          if [ "$STATUS" != "success" ] && [ "$STATUS" != "failed" ] && [ "$STATUS" != "skipped" ]; then
            echo "FAIL: expected success, failed, or skipped but got '$STATUS'"
            exit 1
          fi
          echo "PASS: sponsorshipStatus correctly reports a valid value with optional inputs: '$STATUS'"
