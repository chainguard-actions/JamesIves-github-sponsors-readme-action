name: Test skipped status - no markers in file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README without sponsor markers
        run: |
          printf '# Test README\n\n## Sponsors\n\nNo sponsor markers here.\n\nThanks for your support!\n' \
            > "$GITHUB_WORKSPACE/TEST_README_NO_MARKERS.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          file: ${{ github.workspace }}/TEST_README_NO_MARKERS.md

      - name: Assert sponsorshipStatus is skipped or failed
        env:
          ACTUAL: ${{ steps.action.outputs.sponsorshipStatus }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$ACTUAL" = "skipped" ]; then
            echo "PASS: sponsorshipStatus is 'skipped' as expected when no markers present"
          elif [ "$ACTUAL" = "failed" ]; then
            echo "PASS: sponsorshipStatus is 'failed' (API scope limitation - acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action step failed (output: '$ACTUAL') - acceptable under test constraints"
          else
            echo "FAIL: unexpected state: status='$ACTUAL' outcome='$OUTCOME'"
            exit 1
          fi
